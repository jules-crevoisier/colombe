# Dovecot 2.4 : connexion unique OIDC pour Colombe (banc d'essai docker-compose.sso.yml).
# Remplace conf.d/auth.conf de l'image dovecot/dovecot:2.4.1.
#
# Deux modes, choisis côté Colombe par MAIL_SSO_AUTH :
#   - oauth2 (recommandé) : Colombe présente le jeton d'accès OIDC (SASL XOAUTH2 ou
#     OAUTHBEARER) ; Dovecot le fait valider par le fournisseur (introspection RFC 7662).
#   - master : utilisateur maître Dovecot (« utilisateur*maître »), accès à toutes les boîtes.

# PLAIN/LOGIN restent nécessaires au mode master (et aux logiciels de messagerie).
auth_mechanisms = plain login xoauth2 oauthbearer

# --- Jetons OIDC (Keycloak) ---
# Depuis Dovecot 2.4, les mécanismes XOAUTH2/OAUTHBEARER utilisent directement ce bloc
# (plus de « passdb oauth2 » pour les jetons).
oauth2 {
  # POST du jeton sur le point d'introspection, authentifié par un client confidentiel
  # dédié à Dovecot (identifiant:secret dans l'URL = authentification HTTP Basic).
  introspection_mode = post
  introspection_url = http://dovecot:dovecot-introspection-secret@keycloak:8080/realms/colombe/protocol/openid-connect/token/introspect
  # Le jeton doit appartenir à l'utilisateur annoncé dans XOAUTH2/OAUTHBEARER.
  username_attribute = email
  # Jeton révoqué, expiré ou session Keycloak fermée : introspection « active: false ».
  active_attribute = active
  active_value = true
}

# --- Utilisateur maître (mode MAIL_SSO_AUTH=master uniquement) ---
auth_master_user_separator = *
passdb passwd-file {
  passwd_file_path = /etc/dovecot/master-users
  master = yes
  # Vérifie ensuite que la boîte cible existe (passdb suivante).
  result_success = continue
}

# Comptes du banc d'essai : tout utilisateur @universite.example, mot de passe fixe
# (jamais utilisé par la connexion unique ; sert à la vérification d'existence du mode master).
passdb static {
  password = %{env:USER_PASSWORD}
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/vmail/%{user | lower}
  }
}

# Soumission SMTP (port 31587) : relais vers Mailpit, qui garde les messages pour le test.
submission_relay_host = mailpit
submission_relay_port = 1025
submission_relay_ssl = no
