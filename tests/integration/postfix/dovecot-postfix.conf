# Dovecot 2.4 : identique au bloc oauth2 { } testé dans tests/integration/sso/dovecot-sso.conf
# (même royaume Keycloak, mêmes comptes dev/alice), plus un service auth exposé en TCP
# (inet_listener) pour que Postfix — conteneur séparé — délègue sa soumission SMTP à
# Dovecot : docs/admin/connexion-unique.md, §Postfix (soumission SMTP).

auth_mechanisms = plain login xoauth2 oauthbearer

oauth2 {
  introspection_mode = post
  introspection_url = http://dovecot:dovecot-introspection-secret@keycloak-postfix:8080/realms/colombe/protocol/openid-connect/token/introspect
  username_attribute = email
  active_attribute = active
  active_value = true
}

passdb static {
  password = %{env:USER_PASSWORD}
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/vmail/%{user | lower}
  }
}

# Service auth exposé à Postfix (conteneur séparé, pas de socket Unix partagé) : voir
# https://doc.dovecot.org/main/howto/sasl/postfix.html, §« TCP-based authentication ».
service auth {
  inet_listener auth-postfix {
    port = 12345
  }
}
