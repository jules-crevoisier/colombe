# Dovecot 2.4 : connexion unique OIDC pour Colombe, fournisseur Apereo CAS 7.1.6 (banc
# d'essai docker-compose.cas.yml). Remplace conf.d/auth.conf de l'image dovecot/dovecot:2.4.1.
# Miroir de tests/integration/sso/dovecot-sso.conf (Keycloak) — voir ce fichier pour le
# principe général ; ici seules les valeurs propres à CAS changent.

# plain/login restent déclarés car Dovecot 2.4 exige structurellement au moins un passdb
# « LOGIN » dans le fichier (constaté empiriquement : sans eux, "Fatal: No passdbs
# specified in configuration file. LOGIN mechanism needs one" même avec seulement
# xoauth2/oauthbearer dans auth_mechanisms) — le passdb static ci-dessous n'est jamais
# joignable en pratique (mot de passe fixe non communiqué aux clients). Pas de mode
# utilisateur maître dans ce banc (voir tests/integration/sso/ pour ce mode, testé avec
# Keycloak uniquement).
auth_mechanisms = plain login xoauth2 oauthbearer

# --- Jetons OIDC (CAS) ---
oauth2 {
  # POST du jeton sur /cas/oidc/introspect, authentifié par le client confidentiel « dovecot »
  # (etc/cas/services/dovecot-10002.json), identifiant:secret en HTTP Basic dans l'URL — même
  # principe que Keycloak, CAS documente la même authentification HTTP Basic pour /oidc/introspect.
  introspection_mode = post
  introspection_url = http://dovecot:dovecot-cas-introspection-secret@cas:8080/cas/oidc/introspect
  # Constaté empiriquement (voir docs/admin/connexion-unique.md, §CAS) : la réponse
  # d'introspection de CAS 7.1.6 ne porte JAMAIS les attributs relâchés par
  # attributeReleasePolicy (mail, uid…) — seulement les champs RFC 7662 standard (active,
  # sub, scope, iat, exp, iss, aud, client_id…). « sub » vaut par défaut l'identifiant CAS
  # nu (« dev »), jamais l'adresse de messagerie envoyée par Colombe en SASL — d'où le
  # usernameAttributeProvider de etc/cas/services/colombe-10001.json, qui fixe le principal
  # OIDC du client colombe sur l'attribut « mail » : « sub » devient alors l'adresse complète
  # et correspond à ce que Dovecot compare au nom d'utilisateur SASL.
  username_attribute = sub
  active_attribute = active
  active_value = true
}

# passdb structurel (voir remarque ci-dessus sur auth_mechanisms) : mot de passe fixe jamais
# communiqué aux clients, ne sert pas à la connexion unique.
passdb static {
  password = %{env:USER_PASSWORD}
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/vmail/%{user | lower}
  }
}

# Soumission SMTP (port 31587) : relais vers Mailpit, qui garde les messages pour le test.
submission_relay_host = mailpit
submission_relay_port = 1025
submission_relay_ssl = no
