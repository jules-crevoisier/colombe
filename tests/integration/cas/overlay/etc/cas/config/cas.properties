# Colombe : banc d'essai CAS 7.1.6 comme fournisseur OpenID Connect (docker-compose.cas.yml).
# Miroir de tests/integration/sso/ (Keycloak), voir tests/integration/cas.dovecot.test.ts.
#
# Pas de TLS : conteneur de test réseau interne uniquement (comme Keycloak KC_HOSTNAME=http://
# dans le banc Keycloak — openid-client accepte http en boucle locale, voir isLoopbackHttp()
# dans server/lib/auth/oidc/client.ts).
server.port=8080
server.ssl.enabled=false
server.servlet.context-path=/cas

# Émetteur (iss) fixe, quel que soit le nom utilisé pour joindre CAS : le navigateur et
# Colombe passent par localhost:8444, Dovecot par cas:8080 sur le réseau interne Docker.
# Sans ce réglage explicite, cas.server.name se déduirait de la requête entrante et l'« iss »
# vu par Dovecot (interne) différerait de celui vu par Colombe (public) → jeton refusé.
cas.server.name=http://localhost:8444
cas.server.prefix=${cas.server.name}${server.servlet.context-path}

# --- Authentification statique (comptes de test, miroir du banc Keycloak dev/alice) ---
cas.authn.accept.users=dev::dev-sso-password,alice::alice-sso-password

# --- Attributs : dépôt JSON statique par utilisateur (adresse de messagerie et identifiant nu) ---
cas.authn.attribute-repository.core.default-attributes-to-release=mail,uid,givenName,sn
cas.authn.attribute-repository.json[0].location=file:/etc/cas/config/attributes.json

# --- Fournisseur OpenID Connect ---
cas.authn.oidc.core.issuer=${cas.server.prefix}/oidc
# CAS génère ce fichier de clés (JWKS) tout seul au premier démarrage s'il est absent.
cas.authn.oidc.jwks.file-system.jwks-file=file:/etc/cas/config/keystore.jwks

# --- Registre des services (déclarations JSON dans /etc/cas/services, voir ce dossier) ---
cas.service-registry.core.init-from-json=true
cas.service-registry.json.location=file:/etc/cas/services

# --- Cookie de replication de session OAuth/OIDC (porte l'état du flux code+PKCE entre
# /oidc/oidcAuthorize et /oauth2.0/callbackAuthorize) : marqué Secure par défaut, donc jamais
# renvoyé par le client sur ce banc en http:// simple → le code d'autorisation n'apparaît
# jamais dans la redirection finale (constaté empiriquement, voir docs/admin/connexion-unique.md).
cas.authn.oauth.session-replication.cookie.secure=false
cas.authn.oauth.session-replication.cookie.same-site-policy=lax

# --- Grant « password » (ROPC) : activé uniquement pour le client de test Colombe (voir
# services/colombe-oidc.json, supportedGrantTypes = password + authorization_code +
# refresh_token) — pratique pour les tests de bibliothèque (jeton réel sans piloter le
# formulaire de connexion). CAS documente ce grant comme supporté (endpoint
# /oauth2.0/accessToken ou /oidc/token, grant_type=password), pas besoin de module séparé.

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
