# Dovecot 2.4 : connexion unique OIDC pour Colombe, jetons émis par Keycloak après une
# fédération SAML (banc d'essai docker-compose.saml.yml). Identique au bloc oauth2 { }
# testé dans tests/integration/sso/dovecot-sso.conf — Dovecot ne voit jamais le SAML, ce
# royaume Keycloak est le même fournisseur OIDC que celui du banc Keycloak direct, il ne
# fait qu'ajouter la fédération SAML en amont, invisible de Dovecot comme de Colombe.

auth_mechanisms = plain login xoauth2 oauthbearer

oauth2 {
  introspection_mode = post
  introspection_url = http://dovecot:dovecot-saml-introspection-secret@keycloak-saml:8080/realms/colombe/protocol/openid-connect/token/introspect
  username_attribute = email
  active_attribute = active
  active_value = true
}

passdb static {
  password = %{env:USER_PASSWORD}
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/vmail/%{user | lower}
  }
}

# Soumission SMTP (port 31587) : relais vers Mailpit, qui garde les messages pour le test.
submission_relay_host = mailpit
submission_relay_port = 1025
submission_relay_ssl = no
