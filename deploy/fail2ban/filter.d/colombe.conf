# Colombe journalise exactement une ligne par échec de connexion ou de double
# authentification (stdout/stderr -> journald, capturée par le backend
# "systemd" de fail2ban, voir ../jail.d/colombe.local) :
#
#   [colombe] auth-failure ip=<IP> user=<email>
#
# Testé (fail2ban-regex non disponible sur ce poste de développement Windows) :
# voir la vérification dans la description de commit / le rapport de tâche.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^.*\[colombe\] auth-failure ip=<HOST> user=\S*$
ignoreregex =
