# Autoconfiguration Thunderbird (autoconfig) et Outlook (autodiscover) —
# équivalent Nginx de ../apache/autoconfig.conf. Voir docs/DEPLOIEMENT.md
# (ROADMAP, G) et la page « Autres applications » de Colombe.
#
# À adapter avant activation :
#   - remplacer <domain> par le domaine de l'établissement (ex. mmi-troyes.fr) ;
#   - vérifier que autoconfig.<domain> et autodiscover.<domain> résolvent vers
#     ce serveur (enregistrements DNS) ;
#   - fournir un certificat TLS (peut réutiliser celui du site principal, ou
#     un certificat Let's Encrypt dédié à ces deux noms).
#
# Installation :
#   sudo cp autoconfig.conf /etc/nginx/conf.d/colombe-autoconfig.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name autoconfig.<domain>;

    # ssl_certificate /etc/letsencrypt/live/<domain>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;

    location /mail/config-v1.1.xml {
        proxy_pass http://127.0.0.1:3100/colombe/mail/config-v1.1.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/autoconfig/mail/config-v1.1.xml {
        proxy_pass http://127.0.0.1:3100/colombe/.well-known/autoconfig/mail/config-v1.1.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name autodiscover.<domain>;

    # ssl_certificate /etc/letsencrypt/live/<domain>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;

    location /autodiscover/autodiscover.xml {
        proxy_pass http://127.0.0.1:3100/colombe/autodiscover/autodiscover.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /Autodiscover/Autodiscover.xml {
        proxy_pass http://127.0.0.1:3100/colombe/Autodiscover/Autodiscover.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
