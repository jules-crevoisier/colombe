# Reverse proxy Nginx pour Colombe, sous /colombe (équivalent de
# ../apache/colombe.conf — voir docs/DEPLOIEMENT.md). À inclure dans un bloc
# server { } déjà configuré en TLS (server_name, certificats).
#
# Installation :
#   sudo cp colombe.conf /etc/nginx/conf.d/colombe.conf   # ou "include" depuis le vhost
#   sudo nginx -t && sudo systemctl reload nginx

location = /colombe {
    return 301 /colombe/;
}

# Flux d'évènements (SSE, IMAP IDLE -> navigateur) : pas de mise en tampon,
# et un délai d'inactivité assez long pour une connexion qui reste ouverte.
location /colombe/api/events {
    proxy_pass http://127.0.0.1:3100/colombe/api/events;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /colombe/ {
    proxy_pass http://127.0.0.1:3100/colombe/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Pièces jointes : limite applicative 15 Mo (voir
    # server/lib/session/compose-schema.ts, MAX_ATTACHMENTS_BYTES) + marge
    # pour l'enveloppe multipart.
    client_max_body_size 20m;
}

