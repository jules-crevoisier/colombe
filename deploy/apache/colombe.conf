# Reverse proxy Apache pour Colombe, sous /colombe (installation bare-metal —
# voir docs/admin/proxy-inverse.md). Modules requis : proxy, proxy_http, headers.
#   a2enmod proxy proxy_http headers
#   sudo cp colombe.conf /etc/apache2/conf-available/
#   sudo a2enconf colombe && apache2ctl configtest && sudo systemctl reload apache2
#
# À inclure dans un VirtualHost :443 déjà configuré en TLS (ce fichier ne
# définit pas le VirtualHost lui-même).

# /colombe -> /colombe/ (chemins relatifs de l'application, cf. base_url).
RedirectMatch 301 ^/colombe$ /colombe/

RequestHeader set X-Forwarded-Proto "https"

# Flux d'évènements (SSE, IMAP IDLE -> navigateur) : pas de mise en tampon,
# et un délai d'inactivité assez long pour une connexion qui reste ouverte.
<Location /colombe/api/events>
    ProxyPass http://127.0.0.1:3100/colombe/api/events flushpackets=on timeout=3600
    ProxyPassReverse http://127.0.0.1:3100/colombe/api/events
</Location>

ProxyPreserveHost On
ProxyPass /colombe/ http://127.0.0.1:3100/colombe/
ProxyPassReverse /colombe/ http://127.0.0.1:3100/colombe/

# Redirection des anciens webmails vers Colombe, une fois la migration
# terminée (voir docs/admin/migration-roundcube.md, « Bascule ») :
# RedirectMatch 302 ^/roundcube(/.*)?$ /colombe/
# RedirectMatch 302 ^/webmail(/.*)?$ /colombe/
