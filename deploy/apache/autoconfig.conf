# Autoconfiguration Thunderbird (autoconfig) et Outlook (autodiscover) pour
# les clients de messagerie tiers — voir docs/DEPLOIEMENT.md (ROADMAP, G) et
# la page « Autres applications » de Colombe. Ces routes sont exposées par
# Colombe lui-même (Nitro), sous son chemin de base.
#
# À adapter avant activation :
#   - remplacer <domain> par le domaine de l'établissement (ex. mmi-troyes.fr) ;
#   - vérifier que autoconfig.<domain> et autodiscover.<domain> résolvent vers
#     ce serveur (enregistrements DNS) ;
#   - fournir un certificat TLS (peut réutiliser celui du vhost principal, ou
#     un certificat Let's Encrypt dédié à ces deux noms).
#
# Installation :
#   sudo cp autoconfig.conf /etc/apache2/sites-available/colombe-autoconfig.conf
#   sudo a2ensite colombe-autoconfig && apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:443>
    ServerName autoconfig.<domain>

    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/<domain>/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/<domain>/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass /mail/config-v1.1.xml http://127.0.0.1:3100/colombe/mail/config-v1.1.xml
    ProxyPassReverse /mail/config-v1.1.xml http://127.0.0.1:3100/colombe/mail/config-v1.1.xml

    ProxyPass /.well-known/autoconfig/mail/config-v1.1.xml http://127.0.0.1:3100/colombe/.well-known/autoconfig/mail/config-v1.1.xml
    ProxyPassReverse /.well-known/autoconfig/mail/config-v1.1.xml http://127.0.0.1:3100/colombe/.well-known/autoconfig/mail/config-v1.1.xml
</VirtualHost>

<VirtualHost *:443>
    ServerName autodiscover.<domain>

    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/<domain>/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/<domain>/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass /autodiscover/autodiscover.xml http://127.0.0.1:3100/colombe/autodiscover/autodiscover.xml
    ProxyPassReverse /autodiscover/autodiscover.xml http://127.0.0.1:3100/colombe/autodiscover/autodiscover.xml

    ProxyPass /Autodiscover/Autodiscover.xml http://127.0.0.1:3100/colombe/Autodiscover/Autodiscover.xml
    ProxyPassReverse /Autodiscover/Autodiscover.xml http://127.0.0.1:3100/colombe/Autodiscover/Autodiscover.xml
</VirtualHost>
