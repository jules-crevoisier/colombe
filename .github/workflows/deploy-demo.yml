# Construit les images Docker sur GitHub (le serveur Dokploy n'a que 4 Go de RAM
# et chaque build le faisait swapper), les publie sur ghcr.io, puis demande à
# Dokploy de redéployer : le serveur ne fait plus que télécharger les images.
# Même principe que le dépôt rdv.
# Secrets du dépôt (Settings > Secrets and variables > Actions) :
#   DOKPLOY_URL         ex. https://srko.fr
#   DOKPLOY_API_KEY     Dokploy > Settings > Profile > API/CLI > Generate
#   DOKPLOY_COMPOSE_ID  id du service dans Dokploy (dans l'URL de sa page)
# Sans ces secrets, les images sont publiées et il suffit de cliquer « Deploy » dans Dokploy.
name: Build et déploiement (démo)

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nom des images
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:demo
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Image site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dokploy/site.Dockerfile
          push: true
          # Figées dans le site au build (bouton « Essayer la démo », partage, sitemap).
          # Modifiables via les variables du dépôt COLOMBE_DEMO_URL / COLOMBE_SITE_URL.
          build-args: |
            COLOMBE_DEMO_URL=${{ vars.COLOMBE_DEMO_URL || 'https://demo.colombe.srko.fr' }}
            COLOMBE_SITE_URL=${{ vars.COLOMBE_SITE_URL || 'https://colombe.srko.fr' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}-site:demo
            ${{ env.IMAGE }}-site:${{ github.sha }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,scope=site,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Redéployer sur Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::warning::Secrets Dokploy absents : images publiées, déploiement à lancer depuis Dokploy."
            exit 0
          fi
          curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
